{% extends "base.html" %}
{% block title %}Registro{% endblock %}

{% block content %}
    <header class="header">
        <h1 class="titulo-web">Registro de Usuarios</h1>
        <nav class="nav">
            <a href="{{ url_for('index') }}" class="button">Inicio</a>
        </nav>
    </header>

    <main>
        <section>
            {% if error %}
            <div id="val-box">
                <h3 id="val-msg">{{ error }}</h3>
            </div>
            {% endif %}
            <form id="registro-form" action="{{ url_for('registro') }}" method='POST'>
                <h3>Datos de registro</h3><br>
                <div class="campo">
                    <label for="username">Nombre de usuario:</label>
                    <input type="text" id="username" name="username" placeholder="Ingrese un nombre de usuario (3-20 caracteres)" required>
                </div>
                <div class="campo">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="Ej: juan@ejemplo.com" required>
                </div>
                <div class="campo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre completo. Ej: Juan Pérez" required>
                </div>
                <div class="campo">
                    <label for="telefono">Número de teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ingrese un número de teléfono. Ej: +56912345678">
                </div>
                <div class="campo">
                    <label for="rut">RUT:</label>
                    <input type="text" id="rut" name="rut" placeholder="RUT sin puntos y con guión. Ej: 12345678-9" required>
                </div>
                <div class="campo rol">
                    <input type="radio" id="rol-funcionario" name="rol" value="funcionario" required>
                    <label for="rol-funcionario">Funcionario</label>
                    <input type="radio" id="rol-docente" name="rol" value="docente" required>
                    <label for="rol-docente">Docente</label>
                    <input type="radio" id="rol-estudiante" name="rol" value="estudiante" required>
                    <label for="rol-estudiante">Estudiante</label>
                </div>
                <div class="campo">
                    <label for="region">Región:</label>
                    <select id="region" name="id_region" required>
                        <option value="">Seleccione una región</option>
                        {% for region in regiones %}
                            <option value="{{ region.id }}">{{ region.nombre_region }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="campo">
                    <label for="comuna">Comuna:</label>
                    <select id="comuna" name="id_comuna" required>
                        <option value="">Seleccione una comuna</option>
                        {% for comuna in comunas %}
                            <option value="{{ comuna.id }}" data-region="{{ comuna.region_id }}">
                                {{ comuna.nombre_comuna }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingrese su contraseña (mínimo 6 caracteres)" required>
                </div>
                <div class="campo">
                    <label for="confirm-password">Confirmar contraseña:</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirme su contraseña" required>
                </div>
                <button id="submit-btn" type="submit" class="button">Registrarse</button>
            </form>
        </section>
    </main>
{% endblock %}
{% block script %}
    <script src="{{ url_for('static', filename='js/registro.js') }}"></script>
{% endblock %}
